<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#06030c">
  <title>Panel de patrocinios | Vicious Nocturne</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#06030c; --bg-2:#0d0618; --violet:#8b3dff; --violet-2:#b78cff; --violet-3:#5b1fc7; --red:#e11d48;
      --ink:#f1eaff; --muted:#a99cc4; --card:rgba(22,10,42,.7); --line:rgba(139,61,255,.28);
      --font-title:'Cinzel Decorative','Cinzel',serif; --font-head:'Cinzel',serif; --font-body:'Inter',system-ui,sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:radial-gradient(1000px 600px at 85% -10%,#1a0a33,transparent 60%),var(--bg);color:var(--ink);
      font-family:var(--font-body);font-weight:300;line-height:1.6;min-height:100vh;padding:2rem clamp(1rem,4vw,3rem) 4rem}
    .wrap{max-width:1100px;margin:0 auto}
    h1{font-family:var(--font-title);font-size:clamp(1.6rem,4vw,2.4rem);background:linear-gradient(180deg,#fff,var(--violet-2));
      -webkit-background-clip:text;background-clip:text;color:transparent}
    .sub{color:var(--muted);margin:.3rem 0 1.6rem}
    .banner{border:1px solid rgba(225,29,72,.5);background:rgba(225,29,72,.08);color:#ffc2cf;border-radius:12px;padding:.9rem 1.1rem;margin-bottom:1.4rem;font-size:.92rem}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:1.6rem;backdrop-filter:blur(8px)}
    [hidden]{display:none!important}

    .login{max-width:420px;margin:3rem auto;display:grid;gap:1rem}
    .login h2{font-family:var(--font-head);font-size:1.2rem}
    label{display:block;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--violet-2);margin-bottom:.35rem}
    input[type=text],input[type=email],input[type=password],input[type=search]{width:100%;font:inherit;font-size:.95rem;color:#fff;
      background:rgba(6,3,12,.75);border:1px solid var(--line);border-radius:10px;padding:.7rem .9rem;outline:none}
    input:focus{border-color:var(--violet-2);box-shadow:0 0 0 3px rgba(139,61,255,.25)}
    .btn{font-family:var(--font-head);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.75rem;padding:.7rem 1.2rem;
      border-radius:999px;border:1px solid var(--violet);background:transparent;color:#fff;cursor:pointer;transition:all .2s}
    .btn:hover{background:rgba(139,61,255,.25)}
    .btn.primary{background:linear-gradient(135deg,var(--violet),var(--violet-3))}
    .btn.danger{border-color:rgba(225,29,72,.6);color:#ff9fb3;padding:.4rem .8rem;font-size:.68rem}
    .btn.danger:hover{background:rgba(225,29,72,.2)}
    .err{color:#ff7a93;font-size:.9rem;min-height:1.2em}

    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:1.2rem}
    .stat{padding:1.2rem 1.3rem}
    .stat small{display:block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--violet-2)}
    .stat b{display:block;font-family:var(--font-title);font-size:1.7rem;color:#fff;margin-top:.2rem;font-weight:700}
    .meter{height:.6rem;background:rgba(240,234,255,.1);border-radius:99px;overflow:hidden;margin:.2rem 0 1.4rem}
    .meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6a35d1,#b78cff,#e11d48);transition:width .8s ease}

    .toolbar{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
    .toolbar input{flex:1;min-width:200px}
    .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
    table{width:100%;border-collapse:collapse;font-size:.92rem}
    th,td{text-align:left;padding:.75rem 1rem;border-bottom:1px solid var(--line);white-space:nowrap}
    th{font-family:var(--font-head);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--violet-2);background:rgba(13,6,24,.8)}
    td.num,th.num{text-align:right}
    tr:last-child td{border-bottom:0}
    tbody tr:hover{background:rgba(139,61,255,.08)}
    .tag{display:inline-block;padding:.1rem .6rem;border-radius:99px;border:1px solid var(--line);font-size:.78rem;text-transform:capitalize}
    .empty{padding:2rem;text-align:center;color:var(--muted)}
    .foot{margin-top:1.2rem;color:var(--muted);font-size:.82rem}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Panel de patrocinios</h1>
    <p class="sub">Vicious Nocturne · solo para el equipo · todas las cifras son de prueba</p>

    <div class="banner" id="modeBanner" hidden></div>

    <!-- Inicio de sesión -->
    <section class="card login" id="loginView" hidden>
      <h2>Iniciar sesión</h2>
      <form id="loginForm" class="login" style="margin:0" novalidate>
        <div><label for="email">Correo</label><input type="email" id="email" autocomplete="username" required></div>
        <div><label for="password">Contraseña</label><input type="password" id="password" autocomplete="current-password" required></div>
        <p class="err" id="loginError" role="alert"></p>
        <button class="btn primary" type="submit">Entrar</button>
      </form>
    </section>

    <!-- Panel -->
    <section id="panel" hidden>
      <div class="stats">
        <div class="card stat"><small>Total acumulado</small><b id="sTotal">$0</b></div>
        <div class="card stat"><small>Aportes</small><b id="sCount">0</b></div>
        <div class="card stat"><small>Promedio</small><b id="sAvg">$0</b></div>
        <div class="card stat"><small>Avance de la meta</small><b id="sPct">0%</b></div>
      </div>
      <div class="meter" aria-hidden="true"><i id="sBar"></i></div>

      <div class="toolbar">
        <input type="search" id="search" placeholder="Buscar por nombre o correo…" aria-label="Buscar">
        <button class="btn" id="btnRefresh" type="button">Actualizar</button>
        <button class="btn" id="btnCsv" type="button">Exportar CSV</button>
        <button class="btn" id="btnLogout" type="button">Cerrar sesión</button>
      </div>
      <p class="err" id="panelError" role="alert"></p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Fecha</th><th>Nombre</th><th>Correo</th><th>Paquete</th><th class="num">Monto (MXN)</th><th></th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <p class="empty" id="empty" hidden></p>
      </div>
      <p class="foot" id="foot"></p>
    </section>
  </div>

<script>
(() => {
  'use strict';

  /* ---------- Configuración (los mismos datos que en index.html) ---------- */
  const SUPABASE_URL = '';        // ejemplo: 'https://abcdxyz.supabase.co'
  const SUPABASE_ANON_KEY = '';   // clave pública (anon / publishable). NUNCA pongas la service_role
  const GOAL = 20000;             // meta en MXN (igual que en index.html)
  const LOCAL_KEY = 'vn_aportes_demo';
  const hasBackend = Boolean(SUPABASE_URL && SUPABASE_ANON_KEY);

  const $ = (id) => document.getElementById(id);
  const money = (n) => '$' + Number(n).toLocaleString('es-MX', { maximumFractionDigits: 2 });

  let session = null;   // { token }
  let rows = [];
  let timer = null;

  try { session = JSON.parse(sessionStorage.getItem('vn_admin')) || null; } catch (err) { session = null; }

  const headers = (token) => {
    const h = { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' };
    if (token) h.Authorization = 'Bearer ' + token;
    else if (SUPABASE_ANON_KEY.startsWith('eyJ')) h.Authorization = 'Bearer ' + SUPABASE_ANON_KEY;
    return h;
  };

  const readLocal = () => { try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || []; } catch (err) { return []; } };
  const writeLocal = (list) => localStorage.setItem(LOCAL_KEY, JSON.stringify(list));

  /* ---------- Sesión ---------- */
  async function login(email, password) {
    const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST', headers: headers(), body: JSON.stringify({ email, password })
    });
    if (!res.ok) throw new Error('Correo o contraseña incorrectos.');
    const data = await res.json();
    session = { token: data.access_token };
    try { sessionStorage.setItem('vn_admin', JSON.stringify(session)); } catch (err) { /* sin sessionStorage */ }
  }

  function logout(msg) {
    session = null;
    try { sessionStorage.removeItem('vn_admin'); } catch (err) { /* nada */ }
    clearInterval(timer);
    show();
    $('loginError').textContent = msg || '';
  }

  /* ---------- Datos ---------- */
  async function load() {
    if (!hasBackend) { rows = readLocal(); return; }
    const res = await fetch(
      SUPABASE_URL + '/rest/v1/patrocinios?select=id,creado,nombre,correo,monto,paquete&order=creado.desc&limit=5000',
      { headers: headers(session.token) }
    );
    if (res.status === 401 || res.status === 403) { logout('Tu sesión expiró. Inicia sesión de nuevo.'); throw new Error('Tu sesión expiró. Inicia sesión de nuevo.'); }
    if (!res.ok) throw new Error('No se pudieron leer los datos (error ' + res.status + ').');
    rows = await res.json();
  }

  async function remove(id) {
    if (!hasBackend) { writeLocal(readLocal().filter((r) => r.id !== id)); return; }
    const res = await fetch(SUPABASE_URL + '/rest/v1/patrocinios?id=eq.' + encodeURIComponent(id), {
      method: 'DELETE', headers: Object.assign({ Prefer: 'return=representation' }, headers(session.token))
    });
    if (res.status === 401) { logout('Tu sesión expiró. Inicia sesión de nuevo.'); throw new Error('Tu sesión expiró. Inicia sesión de nuevo.'); }
    if (!res.ok) throw new Error('No se pudo borrar (error ' + res.status + ').');
    const deleted = await res.json();
    if (!deleted.length) throw new Error('No se borró nada: revisa que tu correo coincida con el del SQL.');
  }

  /* ---------- Pintar ---------- */
  function paint() {
    const total = rows.reduce((s, r) => s + Number(r.monto), 0);
    const pct = Math.min(100, Math.round((total / GOAL) * 100));
    $('sTotal').textContent = money(total);
    $('sCount').textContent = String(rows.length);
    $('sAvg').textContent = money(rows.length ? total / rows.length : 0);
    $('sPct').textContent = pct + '%';
    $('sBar').style.width = pct + '%';

    const q = $('search').value.trim().toLowerCase();
    const list = q ? rows.filter((r) => (r.nombre + ' ' + r.correo).toLowerCase().includes(q)) : rows;

    const tbody = $('rows');
    tbody.replaceChildren();
    for (const r of list) {
      const tr = document.createElement('tr');
      const cell = (text, cls) => { const td = document.createElement('td'); td.textContent = text; if (cls) td.className = cls; return td; };
      tr.append(cell(new Date(r.creado).toLocaleString('es-MX', { dateStyle: 'medium', timeStyle: 'short' })));
      tr.append(cell(r.nombre));
      tr.append(cell(r.correo));
      const tagTd = document.createElement('td');
      const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = r.paquete;
      tagTd.append(tag); tr.append(tagTd);
      tr.append(cell(money(r.monto), 'num'));
      const actTd = document.createElement('td'); actTd.className = 'num';
      const del = document.createElement('button'); del.className = 'btn danger'; del.type = 'button'; del.textContent = 'Borrar';
      del.addEventListener('click', async () => {
        if (!confirm('¿Borrar el aporte de ' + r.nombre + ' por ' + money(r.monto) + '? Esto actualiza la meta.')) return;
        try { await remove(r.id); await refresh(); } catch (err) { $('panelError').textContent = err.message; }
      });
      actTd.append(del); tr.append(actTd);
      tbody.append(tr);
    }

    const empty = $('empty');
    if (!list.length) {
      empty.hidden = false;
      empty.textContent = rows.length
        ? 'Ningún resultado para tu búsqueda.'
        : 'Aún no hay aportes. Si esperabas verlos, revisa que el correo con el que entraste sea el mismo que pusiste en schema.sql.';
    } else { empty.hidden = true; }
    $('foot').textContent = 'Mostrando ' + list.length + ' de ' + rows.length + ' aportes · actualizado ' + new Date().toLocaleTimeString('es-MX');
  }

  async function refresh() {
    $('panelError').textContent = '';
    try { await load(); paint(); } catch (err) { $('panelError').textContent = err.message; }
  }

  /* ---------- CSV ---------- */
  const csvCell = (v) => {
    let s = String(v ?? '');
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;          // evita fórmulas en Excel
    return '"' + s.replace(/"/g, '""') + '"';
  };
  function exportCsv() {
    const lines = [['Fecha', 'Nombre', 'Correo', 'Paquete', 'Monto (MXN)'].map(csvCell).join(',')];
    for (const r of rows) lines.push([r.creado, r.nombre, r.correo, r.paquete, r.monto].map(csvCell).join(','));
    const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'patrocinios-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  /* ---------- Vistas ---------- */
  function show() {
    const banner = $('modeBanner');
    if (!hasBackend) {
      banner.hidden = false;
      banner.textContent = 'Modo local: no hay base de datos conectada. Aquí ves solo los aportes de prueba hechos en ESTE navegador. Pega tu URL y clave de Supabase en este archivo para ver los de todos.';
    } else { banner.hidden = true; }

    const loggedIn = !hasBackend || Boolean(session);
    $('loginView').hidden = loggedIn;
    $('panel').hidden = !loggedIn;
    $('btnLogout').hidden = !hasBackend;
    if (loggedIn) {
      refresh();
      clearInterval(timer);
      timer = setInterval(() => { if (!document.hidden) refresh(); }, 30000);
    }
  }

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = $('loginError'); err.textContent = '';
    const email = $('email').value.trim(), password = $('password').value;
    if (!email || !password) { err.textContent = 'Escribe tu correo y contraseña.'; return; }
    try { await login(email, password); $('password').value = ''; show(); }
    catch (ex) { err.textContent = ex.message; }
  });
  $('btnRefresh').addEventListener('click', refresh);
  $('btnCsv').addEventListener('click', exportCsv);
  $('btnLogout').addEventListener('click', () => logout());
  $('search').addEventListener('input', paint);

  show();
})();
</script>
</body>
</html>
